<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Quejas y Sugerencias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
     
    </style>
</head>
<body>
    <main>
        <section>
            <h3>Formulario de Quejas o Sugerencias</h3>
            <form id="formQuejas">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="from_name" required>

                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="reply_to" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="message" rows="5" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
