<div class="container mt-4">
  <h2>Administración de Usuarios</h2>

  <div *ngIf="loading" class="alert alert-info">Cargando...</div>
  <div *ngIf="error" class="alert alert-danger">Error: {{ error }}</div>

  <table class="table mt-4">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Rol</th>
        <th>Categorías</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usuario of usuarios">
        <td>{{ usuario.id }}</td>
        <td>{{ usuario.nombre }}</td>
        <td>{{ usuario.correo }}</td>
        <td>{{ usuario.rol }}</td>
        <td>
          <ul>
            <li *ngFor="let categoria of usuario.categorias">{{categoria.nombre}}</li>
          </ul>
        </td>
        <td>
          <button class="btn btn-primary btn-sm" (click)="editarUsuario(usuario)" [disabled]="loading">Editar</button>
          <button class="btn btn-danger btn-sm ml-2" (click)="eliminarUsuario(usuario.id)" [disabled]="loading">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <h3 *ngIf="!editando">Crear Nuevo Usuario</h3>
  <h3 *ngIf="editando">Editar Usuario: {{ usuarioEditando?.nombre }}</h3>

  <form [formGroup]="usuarioForm" (ngSubmit)="guardarUsuario()">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" class="form-control" id="nombre" formControlName="nombre" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="correo">Correo:</label>
      <input type="email" class="form-control" id="correo" formControlName="correo" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="contrasena">Contraseña:</label>
      <input [type]="mostrarContrasena ? 'text' : 'password'" class="form-control" id="contrasena"
        formControlName="contrasena" autocomplete="new-password">
      <button type="button" class="btn btn-secondary mt-2" (click)="alternarVisibilidadContrasena()">
        {{ mostrarContrasena ? 'Ocultar' : 'Mostrar' }} Contraseña
      </button>
    </div>
    <div class="form-group">
      <label for="rol">Rol:</label>
      <select class="form-control" id="rol" formControlName="rol">
        <option value="adm">Administrador</option>
        <option value="usuario">Usuario</option>
      </select>
    </div>

    <div class="form-group">
      <label for="categorias">Categorías:</label>
      <div *ngFor="let categoria of categorias; let i = index">
        <label>
          <input type="checkbox" [(ngModel)]="categoriasSeleccionadas[i]" [ngModelOptions]="{standalone: true}" />
          {{ categoria.nombre }}
        </label>
      </div>
    </div>

    <button type="submit" class="btn btn-success" [disabled]="usuarioForm.invalid || loading">
      {{ editando ? 'Actualizar' : 'Guardar' }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="cancelarEdicion()" [disabled]="loading">Cancelar</button>
  </form>
</div>
