<h2>Nuestras especialidades</h2>

<div *ngIf="loading()">Cargando...</div>
<div *ngIf="error()">{{ error() }}</div>

<div class="accordion" *ngIf="!loading() && !error()">
  <div class="accordion-item" *ngFor="let category of categories()">
    <div class="category-header" (click)="toggleAccordion(category.id)" [class.expanded]="isExpanded(category.id)">
      {{ category.nombre }}
      <span class="icon" [class.expanded]="isExpanded(category.id)">&gt;</span>
    </div>
    <div class="accordion-content" *ngIf="isExpanded(category.id)">

      <div class="category-info">
        <p *ngIf="category.descripcion" class="description">{{ category.descripcion }}</p>
        <p class="price">Precio: {{ category.precio | currency:'MXN':'symbol':'1.2-2':'es' }}</p>
      </div>

      <ul class="course-list">
        <li *ngFor="let course of getCoursesByCategory(category.id)">
          {{ course.nombre }}
        </li>
        <li *ngIf="getCoursesByCategory(category.id).length === 0">
          No hay cursos disponibles para esta categoría.
        </li>
      </ul>
    </div>
  </div>
</div>
